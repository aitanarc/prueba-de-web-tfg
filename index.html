<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de mi Página</title>
    <style>
        body {
            background-color: pink; /* Cambia el fondo a rosa */
            color: white;           /* Cambia el texto a blanco */
            font-family: Arial, sans-serif; /* Hace que la letra se vea más moderna */
        }
        iframe {
            display: block;
            margin-top: 20px;
            border: none;
            border-radius: 8px; /* Le da bordes redondeados al video */
        }
    </style>
</head>
<body>

    <h1>Hola Mundo</h1>
    <p>Este es el contenido visible de la página web.</p>
    <h2>Aitana Rosa Cabrales</h2>

    <!-- Video de YouTube incrustado al final -->
    <iframe 
        width="560" 
        height="315" 
        src="https://youtube.com" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
    </iframe>

</body>
</html>
